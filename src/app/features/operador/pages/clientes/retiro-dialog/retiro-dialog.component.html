<div class="dialog-content">
  <h2 mat-dialog-title>Registrar Retiro</h2>
  
  <form [formGroup]="retiroForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Monto a Retirar</mat-label>
          <input matInput type="number" formControlName="monto" min="1" [max]="data.saldoDisponible">
          <mat-error *ngIf="retiroForm.get('monto')?.errors?.['required']">
            El monto es requerido
          </mat-error>
          <mat-error *ngIf="retiroForm.get('monto')?.errors?.['min']">
            El monto debe ser mayor a 0
          </mat-error>
          <mat-error *ngIf="retiroForm.get('monto')?.errors?.['max']">
            El monto no puede superar el saldo disponible ($ {{ formatMonto(data.saldoDisponible) }})
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Motivo del Retiro</mat-label>
          <textarea matInput formControlName="motivo" rows="3"></textarea>
          <mat-error *ngIf="retiroForm.get('motivo')?.errors?.['required']">
            El motivo es requerido
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!retiroForm.valid">
        Confirmar Retiro
      </button>
    </mat-dialog-actions>
  </form>
</div>
